events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # API and WebSocket traffic → FastAPI backend.
        #
        # Request body limits are per route (T8). FastAPI reads a whole body before any
        # auth check or handler runs, so these limits are the only gate on body size:
        # each is just above its route's application limit, and everything else keeps
        # nginx's 1 MiB default. A new route that accepts large bodies needs its own
        # location here. Exact matches win first, then regular expressions, then the
        # /api/ prefix.
        location /api/ {
            client_max_body_size 1m;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Image upload (POST) and replace (PUT): the 10 MiB input limit plus multipart
        # overhead. The pattern also matches the list, description edit and delete, which
        # send small bodies anyway.
        location ~ ^/api/host/games/[0-9]+/images(/[0-9]+)?$ {
            client_max_body_size 11m;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Game bundle import: the 40 MiB import limit plus multipart overhead. Processing
        # a bundle's images can take up to the 240 s import deadline, so the read timeout
        # is above it.
        location = /api/host/games/import {
            client_max_body_size 41m;
            proxy_read_timeout 300s;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api/admin/games/import {
            client_max_body_size 41m;
            proxy_read_timeout 300s;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Host React app — static files
        location /host/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /host/index.html;
        }

        # Player React app — static files
        location /player/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /player/index.html;
        }

        # Admin React app — static files
        location /admin/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /admin/index.html;
        }

        # Root redirect
        location = / {
            return 302 /player/;
        }
    }
}
